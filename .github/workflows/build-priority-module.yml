name: Build module with modern and legacy helpers
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: module
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: midori01/susfs4ksu
          ref: 65c44a650f0b0d8c79a517fb1a49c24a7cb22b23
          path: susfs-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Identify artifact revision
        id: revision
        shell: bash
        run: echo "short=$(git -C module rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build pinned modern helper
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;27.2.12479018'
          cd susfs-source/ksu_susfs
          "$ANDROID_HOME/ndk/27.2.12479018/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk APP_ABI=arm64-v8a APP_PLATFORM=android-26
          cp libs/arm64-v8a/ksu_susfs ../../module/ksu_susfs_modern
      - name: Stage and verify directly installable module
        shell: bash
        run: |
          set -euo pipefail
          cp susfs-source/LICENSE module/MODERN-HELPER-LICENSE
          printf '%s\n' 'Source: midori01/susfs4ksu' 'Revision: 65c44a650f0b0d8c79a517fb1a49c24a7cb22b23' 'NDK: 27.2.12479018' > module/MODERN-HELPER-SOURCE.txt
          python3 module/.github/scripts/prepare-distribution.py module module-dist
          for script in module-dist/*.sh; do sh -n "$script"; done
          node --check module-dist/webroot/priority-uid-filter.js
          node --input-type=module --check < module-dist/webroot/assets/index-BS9hEn4H.js
      - uses: actions/upload-artifact@v4
        with:
          name: susfs4ksu-${{ steps.revision.outputs.short }}
          path: module-dist/
          if-no-files-found: error

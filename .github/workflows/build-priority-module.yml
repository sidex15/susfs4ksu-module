name: Build experimental Priority UID Filter module
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: module
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: midori01/susfs4ksu
          ref: 65c44a650f0b0d8c79a517fb1a49c24a7cb22b23
          path: susfs-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Build pinned companion helper
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;27.2.12479018'
          cd susfs-source/ksu_susfs
          "$ANDROID_HOME/ndk/27.2.12479018/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk APP_ABI=arm64-v8a APP_PLATFORM=android-26
          cp libs/arm64-v8a/ksu_susfs ../../module/ksu_susfs_modern
      - name: Assemble and identify UID filter integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root = Path('module')
          build = os.environ['GITHUB_SHA'][:7]
          config = root / 'config.sh'
          text = config.read_text()
          if not re.search(r'^priority_uid_filter=', text, re.M):
              config.write_text(text + '\npriority_uid_filter=0\n')
          boot = root / 'boot-completed.sh'
          text = boot.read_text()
          if 'priority-uid-filter.sh boot' not in text:
              boot.write_text(text + '\n# Optional Priority UID Filter companion\nsh /data/adb/modules/susfs4ksu/priority-uid-filter.sh boot >> /data/adb/susfs4ksu/priority_uid_filter.log 2>&1\n')
          for name in ('index.html', 'custom.html', 'status.html'):
              page = root / 'webroot' / name
              html = page.read_text()
              assert '</head>' in html
              if 'src="/priority-uid-filter.js"' not in html:
                  html = html.replace('</head>', '<script defer src="/priority-uid-filter.js"></script>\n</head>', 1)
              marker = '<p style="color:white;background:#171717;padding:8px;font:12px sans-serif;position:relative;z-index:40">UID Filter UI 2 - build ' + build + '</p>'
              html, count = re.subn(r'(<section\b[^>]*>)', lambda m: m[0] + marker, html, count=1)
              assert count == 1, name + ': missing section'
              page.write_text(html)
          ui = root / 'webroot/priority-uid-filter.js'
          text = ui.read_text()
          assert 'row.hidden = true;' in text
          text = text.replace('row.hidden = true;', 'row.hidden = true; row.style.setProperty("display", "none", "important");')
          text = text.replace('row.hidden = false;', 'row.hidden = false; row.style.removeProperty("display");')
          ui.write_text(text)
          installer = root / 'customize.sh'
          text = installer.read_text()
          anchor = '# set permissions'
          assert anchor in text
          installer.write_text(text.replace(anchor, 'chmod 0755 "${MODPATH}/ksu_susfs_modern"\n' + anchor, 1))
          prop = root / 'module.prop'
          text, count = re.subn(r'^version=(.*)$', lambda m: 'version=' + m[1] + '-UID2-' + build, prop.read_text(), count=1, flags=re.M)
          assert count == 1
          prop.write_text(text)
          (root / 'UID-FILTER-BUILD.txt').write_text('UI integration: 2\nModule revision: ' + os.environ['GITHUB_SHA'] + '\n')
          PY
          sh -n module/priority-uid-filter.sh
          sh -n module/boot-completed.sh
          sh -n module/customize.sh
          node --check module/webroot/priority-uid-filter.js
          grep -a -q set_priority_uid_filter module/ksu_susfs_modern
          cp susfs-source/LICENSE module/MODERN-HELPER-LICENSE
          printf '%s\n' 'Source: midori01/susfs4ksu' 'Revision: 65c44a650f0b0d8c79a517fb1a49c24a7cb22b23' 'NDK: 27.2.12479018' > module/MODERN-HELPER-SOURCE.txt
          cd module
          sha256sum ksu_susfs_modern > MODERN-HELPER-SHA256SUMS
          zip -qr ../susfs4ksu-priority-experimental.zip . -x '.git/*' '.github/*'
      - name: Verify installable ZIP contains the complete integration
        shell: bash
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('susfs4ksu-priority-experimental.zip') as archive:
              for path in ('priority-uid-filter.sh', 'ksu_susfs_modern', 'webroot/priority-uid-filter.js', 'UID-FILTER-BUILD.txt'):
                  assert archive.getinfo(path).file_size > 0, path
              for name in ('index.html', 'custom.html', 'status.html'):
                  html = archive.read('webroot/' + name).decode()
                  assert 'src="/priority-uid-filter.js"' in html, name
                  assert 'UID Filter UI 2 - build ' in html, name
              assert b'priority_uid_filter=' in archive.read('config.sh')
              assert b'priority-uid-filter.sh boot' in archive.read('boot-completed.sh')
              assert b'set_priority_uid_filter' in archive.read('ksu_susfs_modern')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: susfs4ksu-priority-experimental
          path: susfs4ksu-priority-experimental.zip
          if-no-files-found: error

name: Build module with upstream and legacy helpers
on:
  workflow_dispatch:
    inputs:
      helper_source:
        description: 'SUSFS binary source'
        type: choice
        required: true
        default: pinned
        options:
          - pinned
          - latest
      helper_sha:
        description: 'Helper commit SHA override (optional full 40-character SHA; ignores dropdown)'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      helper_source:
        type: string
        required: false
        default: pinned
      helper_sha:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_URL: https://gitlab.com/simonpunk/susfs4ksu.git
      PINNED_HELPER_REV: a2165b6f875b73e2f87d3c6f12814efac8de061d
      UPSTREAM_BRANCH: gki-android14-6.1
      HELPER_SOURCE: ${{ inputs.helper_source }}
      HELPER_SHA: ${{ inputs.helper_sha }}
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: module
          persist-credentials: false
      - name: Select and fetch upstream helper source
        shell: bash
        run: |
          set -euo pipefail
          expected=''
          if [ -n "$HELPER_SHA" ]; then
            if [[ ! "$HELPER_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo 'helper_sha must be a full 40-character hexadecimal commit SHA' >&2
              exit 1
            fi
            ref=$(printf '%s' "$HELPER_SHA" | tr 'A-F' 'a-f')
            expected="$ref"
            selection=sha-override
          else
            selection="$HELPER_SOURCE"
            case "$HELPER_SOURCE" in
              pinned) ref="$PINNED_HELPER_REV"; expected="$ref" ;;
              latest) ref="refs/heads/$UPSTREAM_BRANCH" ;;
              *) echo 'Invalid helper_source; expected pinned or latest' >&2; exit 1 ;;
            esac
          fi
          mkdir susfs-source helper-source-artifact
          git -C susfs-source init
          git -C susfs-source remote add origin "$SOURCE_URL"
          git -C susfs-source fetch --depth=1 origin "$ref"
          git -C susfs-source checkout --detach FETCH_HEAD
          revision=$(git -C susfs-source rev-parse HEAD)
          if [ -n "$expected" ]; then test "$revision" = "$expected"; fi
          echo "SOURCE_SHA=$revision" >> "$GITHUB_ENV"
          echo "SOURCE_SELECTION=$selection" >> "$GITHUB_ENV"
          git -C susfs-source show -s --format=fuller HEAD > helper-source-artifact/SOURCE-COMMIT.txt
          git -C susfs-source archive --format=tar.gz --prefix=susfs-source/ HEAD > helper-source-artifact/upstream-source.tar.gz
          test -f susfs-source/ksu_susfs/jni/Android.mk
          test -f susfs-source/ksu_susfs/jni/Application.mk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Identify artifact revision
        id: revision
        shell: bash
        run: echo "short=$(git -C module rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and verify upstream ARM64 helper
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;$NDK_VERSION"
          cd susfs-source/ksu_susfs
          "$ANDROID_HOME/ndk/$NDK_VERSION/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk APP_ABI=arm64-v8a APP_PLATFORM=android-26
          cd ../..
          install -m 0755 susfs-source/ksu_susfs/libs/arm64-v8a/ksu_susfs module/ksu_susfs_modern
          readelf -h module/ksu_susfs_modern | tee helper-source-artifact/elf-header.txt
          grep -Eq 'Class:.*ELF64' helper-source-artifact/elf-header.txt
          grep -Eq 'Machine:.*AArch64' helper-source-artifact/elf-header.txt
          grep -a -q set_priority_uid_filter module/ksu_susfs_modern
      - name: Stage and verify directly installable module
        shell: bash
        run: |
          set -euo pipefail
          cp susfs-source/LICENSE module/MODERN-HELPER-LICENSE
          {
            printf 'Source: %s\nSelection: %s\nRevision: %s\nNDK: %s\n' "$SOURCE_URL" "$SOURCE_SELECTION" "$SOURCE_SHA" "$NDK_VERSION"
            printf '%s\n' 'ABI: arm64-v8a; API: android-26' 'Module-local filename retained for router compatibility: ksu_susfs_modern' 'Build checks do not establish runtime compatibility. Kernel code is not updated.'
            sha256sum module/ksu_susfs_modern | awk '{print "Helper SHA256: " $1}'
          } > module/MODERN-HELPER-SOURCE.txt
          cp module/MODERN-HELPER-SOURCE.txt helper-source-artifact/PROVENANCE.txt
          cp module/MODERN-HELPER-LICENSE helper-source-artifact/SOURCE-LICENSE
          (cd helper-source-artifact && sha256sum upstream-source.tar.gz > SHA256SUMS)
          python3 module/.github/scripts/prepare-distribution.py module module-dist
          cmp module/ksu_susfs_modern module-dist/ksu_susfs_modern
          (cd module-dist && sha256sum -c HELPER-SHA256SUMS)
          for script in module-dist/*.sh; do sh -n "$script"; done
          node --check module-dist/webroot/priority-uid-filter.js
          node --input-type=module --check < module-dist/webroot/assets/index-BS9hEn4H.js
          {
            echo '## Module with upstream SUSFS helper'
            printf 'Selection: `%s`\n\nHelper commit: `%s`\n\n' "$SOURCE_SELECTION" "$SOURCE_SHA"
            echo 'A non-empty SHA overrides the dropdown. Otherwise pinned is the default.'
            echo 'Latest and SHA overrides affect this build only; neither changes the saved pin.'
            echo 'Helper routing and legacy compatibility are unchanged. New revisions require device testing.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: susfs4ksu-${{ steps.revision.outputs.short }}
          path: module-dist/
          if-no-files-found: error
      - name: Upload exact helper source and provenance
        uses: actions/upload-artifact@v4
        with:
          name: susfs-helper-source-${{ github.run_id }}
          path: helper-source-artifact/
          if-no-files-found: error

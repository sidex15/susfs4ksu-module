name: Build experimental Priority UID Filter module
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.5.2+
          path: module
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: midori01/susfs4ksu
          ref: 65c44a650f0b0d8c79a517fb1a49c24a7cb22b23
          path: susfs-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Build pinned companion helper
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;27.2.12479018'
          cd susfs-source/ksu_susfs
          "$ANDROID_HOME/ndk/27.2.12479018/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk APP_ABI=arm64-v8a APP_PLATFORM=android-26
          cp libs/arm64-v8a/ksu_susfs ../../module/ksu_susfs_modern
      - name: Assemble opt-in experimental integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('module')
          config = root / 'config.sh'
          config.write_text(config.read_text() + '\npriority_uid_filter=0\n')
          boot = root / 'boot-completed.sh'
          boot.write_text(boot.read_text() + '\n# Optional Priority UID Filter companion\nsh /data/adb/modules/susfs4ksu/priority-uid-filter.sh boot >> /data/adb/susfs4ksu/priority_uid_filter.log 2>&1\n')
          index = root / 'webroot/index.html'
          html = index.read_text()
          assert '</head>' in html
          index.write_text(html.replace('</head>', '<script defer src="/priority-uid-filter.js"></script>\n</head>', 1))
          installer = root / 'customize.sh'
          text = installer.read_text()
          anchor = '# set permissions'
          assert anchor in text
          installer.write_text(text.replace(anchor, 'chmod 0755 "${MODPATH}/ksu_susfs_modern"\n' + anchor, 1))
          PY
          sh -n module/priority-uid-filter.sh
          sh -n module/boot-completed.sh
          sh -n module/customize.sh
          node --check module/webroot/priority-uid-filter.js
          grep -a -q set_priority_uid_filter module/ksu_susfs_modern
          cp susfs-source/LICENSE module/MODERN-HELPER-LICENSE
          printf '%s\n' 'Source: midori01/susfs4ksu' 'Revision: 65c44a650f0b0d8c79a517fb1a49c24a7cb22b23' 'NDK: 27.2.12479018' > module/MODERN-HELPER-SOURCE.txt
          cd module
          sha256sum ksu_susfs_modern > MODERN-HELPER-SHA256SUMS
          zip -qr ../susfs4ksu-priority-experimental.zip . -x '.git/*' '.github/*'
      - uses: actions/upload-artifact@v4
        with:
          name: susfs4ksu-priority-experimental
          path: susfs4ksu-priority-experimental.zip

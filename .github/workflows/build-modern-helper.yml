name: Build modern SUSFS helper (experimental)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned SUSFS source copy
        uses: actions/checkout@v4
        with:
          repository: midori01/susfs4ksu
          ref: 65c44a650f0b0d8c79a517fb1a49c24a7cb22b23
          path: susfs-source
          persist-credentials: false
      - name: Set up Java for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          sdkmanager --install 'ndk;27.2.12479018'
          test -x "$ANDROID_HOME/ndk/27.2.12479018/ndk-build"
      - name: Build arm64 helper and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cd susfs-source/ksu_susfs
          "$ANDROID_HOME/ndk/27.2.12479018/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk APP_ABI=arm64-v8a APP_PLATFORM=android-26
          cp libs/arm64-v8a/ksu_susfs ../../artifact/ksu_susfs_modern_arm64
          cd ../..
          file artifact/ksu_susfs_modern_arm64 | tee artifact/file-info.txt
          grep -a -q set_priority_uid_filter artifact/ksu_susfs_modern_arm64
          printf '%s\n' 'Source copy: midori01/susfs4ksu' 'Revision: 65c44a650f0b0d8c79a517fb1a49c24a7cb22b23' 'NDK: 27.2.12479018' 'Experimental: not device-tested; does not replace the universal module helper.' > artifact/PROVENANCE.txt
          cp susfs-source/LICENSE artifact/SOURCE-LICENSE
          sha256sum artifact/ksu_susfs_modern_arm64 > artifact/SHA256SUMS
      - name: Upload experimental helper
        uses: actions/upload-artifact@v4
        with:
          name: susfs-modern-helper-arm64
          path: artifact/
